<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#EEF4FC" />
    <title>VocaLock</title>
    <!-- Resolve the theme before the first paint, otherwise a dark-mode user
         gets a white flash while the bundle loads. Mirrors src/lib/theme.ts. -->
    <script>
      (function () {
        var pref = 'light';
        try {
          pref = localStorage.getItem('vocalock.theme') || 'light';
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref === 'auto' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#0D1526' : '#EEF4FC');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
